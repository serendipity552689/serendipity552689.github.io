<aside class="info-panel" id="info-panel" hidden><h3>关于这段小日常</h3><p>这是 Instagram 风格的离线聊天体验，与 Instagram 无关联。对话使用本地预设回复，不会上传。<br><br>小秘密：发送 mj 或 MJ，两个彩蛋各占一半概率。蜘蛛侠会吊着蛛丝出现在聊天上方，动画结束后自动离开。聊天始终可以使用，按 Esc 可提前收起彩蛋。</p><button id="close-info">知道啦</button></aside>

const history=[{text:'嗨，终于等到你啦。',user:false},{text:'今天有没有什么，想要分享的小事？',user:false},{text:'来这里，给日常加点糖。',user:true},{text:'对了，悄悄告诉你：试试发送 mj 或 MJ。',user:false}];

function icon(id){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('aria-hidden','true');const use=document.createElementNS(svg.namespaceURI,'use');use.setAttribute('href','#'+id);svg.append(use);return svg;}
function avatar(){const el=document.createElement('div');el.className='avatar orange';el.setAttribute('aria-hidden','true');el.append(icon('smile'));return el;}
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3200);}
function scrollBottom(){const el=$('chat-scroll');el.scrollTop=el.scrollHeight;}
function renderMessage(message){const row=document.createElement('div');row.className='message '+(message.user?'user':'bot');if(!message.user)row.append(avatar());const body=document.createElement('div');body.className='message-body';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=message.text;body.append(bubble);row.append(body);$('messages').append(row);}
function appendMessage(text,user){const message={text,user};history.push(message);if(history.length>60)history.shift();renderMessage(message);while($('messages').children.length>60)$('messages').firstElementChild.remove();scrollBottom();}
function isSecret(text){const clean=text.trim();return clean==='mj'||clean==='MJ';}
function randomVideoIndex(){if(globalThis.crypto&&typeof crypto.getRandomValues==='function'){const data=new Uint32Array(1);crypto.getRandomValues(data);return data[0]<0x80000000?0:1;}return Math.random()<.5?0:1;}
function fitSprite(){if(!workW)return;const chat=document.querySelector('.chat').getBoundingClientRect();const head=document.querySelector('.chat-head').getBoundingClientRect();const composer=document.querySelector('.composer-zone').getBoundingClientRect();const top=head.bottom+4;const available=Math.max(120,composer.top-top-8);const width=Math.min(chat.width*1.12,680,available*workW/workH);canvas.style.width=width+'px';canvas.style.height=(width*workH/workW)+'px';canvas.style.left=(chat.left+chat.width/2)+'px';canvas.style.top=top+'px';}
function prepareMatte(){workW=Math.min(480,video.videoWidth);workH=Math.round(video.videoHeight*workW/video.videoWidth);sourceCanvas.width=canvas.width=workW;sourceCanvas.height=canvas.height=workH;matte=new Uint8Array(workW*workH);queue=new Int32Array(workW*workH);fitSprite();}
function removeBackground(frame){
  const started=performance.now(),data=frame.data,w=workW,h=workH,total=w*h;
  // Use flood fill from all four edges, not global white removal: enclosed white eyes stay intact.
  const sample=(Math.min(8,h-1)*w+Math.min(8,w-1))*4;
  const br=data[sample],bg=data[sample+1],bb=data[sample+2];
  for(let i=0,p=0;i<total;i++,p+=4){const r=data[p],g=data[p+1],b=data[p+2];const hi=Math.max(r,g,b),lo=Math.min(r,g,b);matte[i]=(lo>145&&hi-lo<46&&Math.max(Math.abs(r-br),Math.abs(g-bg),Math.abs(b-bb))<78)?1:0;}
  // Source footage has a thin dark border. It is not part of the character.
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(x<3||y<3||x>=w-3||y>=h-3)matte[y*w+x]=1;
  let head=0,tail=0;
  function push(i){if(matte[i]===1){matte[i]=2;queue[tail++]=i;}}
  for(let x=0;x<w;x++){push(x);push((h-1)*w+x);}for(let y=1;y<h-1;y++){push(y*w);push(y*w+w-1);}
  while(head<tail){const i=queue[head++],x=i%w;if(x>0)push(i-1);if(x<w-1)push(i+1);if(i>=w)push(i-w);if(i<total-w)push(i+w);}
  for(let i=0,p=0;i<total;i++,p+=4){
    if(matte[i]===2){data[p+3]=0;continue;}
    const x=i%w;
    const adjacent=(x>0&&matte[i-1]===2)||(x<w-1&&matte[i+1]===2)||(i>=w&&matte[i-w]===2)||(i<total-w&&matte[i+w]===2);
    if(adjacent){const hi=Math.max(data[p],data[p+1],data[p+2]),lo=Math.min(data[p],data[p+1],data[p+2]);if(hi-lo<40&&lo>55){const alpha=Math.max(.3,Math.min(1,(Math.max(br,bg,bb)-lo)/150));data[p+3]=Math.round(alpha*255);data[p]=Math.max(0,(data[p]-br*(1-alpha))/alpha);data[p+1]=Math.max(0,(data[p+1]-bg*(1-alpha))/alpha);data[p+2]=Math.max(0,(data[p+2]-bb*(1-alpha))/alpha);}}
  }
  lastMatteMs=performance.now()-started;maxMatteMs=Math.max(maxMatteMs,lastMatteMs);return frame;
}
function drawFrame(){if(video.readyState<2||!workW||canvas.hidden)return;sourceCtx.drawImage(video,0,0,workW,workH);const frame=sourceCtx.getImageData(0,0,workW,workH);ctx.putImageData(removeBackground(frame),0,0);renderedFrames++;}
function cancelFrames(){if(frameCallback&&video.cancelVideoFrameCallback)video.cancelVideoFrameCallback(frameCallback);cancelAnimationFrame(animationCallback);frameCallback=animationCallback=0;}
function scheduleFrames(request){cancelFrames();function next(){if(request!==eggRequest||canvas.hidden||video.paused)return;if(video.currentTime!==lastMediaTime){lastMediaTime=video.currentTime;drawFrame();}if(video.requestVideoFrameCallback)frameCallback=video.requestVideoFrameCallback(next);else animationCallback=requestAnimationFrame(next);}next();}
function endEgg(){++eggRequest;clearTimeout(eggSafety);cancelFrames();video.pause();canvas.hidden=true;ctx.clearRect(0,0,canvas.width,canvas.height);$('egg-status').textContent='蜘蛛侠彩蛋已结束。';}
function triggerEgg(){
  const request=++eggRequest;clearTimeout(eggSafety);cancelFrames();video.pause();selectedIndex=randomVideoIndex();canvas.hidden=true;ctx.clearRect(0,0,canvas.width,canvas.height);renderedFrames=0;maxMatteMs=0;lastMediaTime=-1;
  video.src=VIDEO_SOURCES[selectedIndex];video.load();$('egg-status').textContent='蜘蛛侠彩蛋出现；可以继续聊天，按 Esc 可收起。';
  const play=video.play();if(play)play.catch(error=>{if(request!==eggRequest||error.name==='AbortError')return;endEgg();toast('浏览器暂时阻止了动画，请再发送一次 mj。');});
  eggSafety=setTimeout(()=>{if(request===eggRequest)endEgg();},15000);
}
video.addEventListener('loadedmetadata',prepareMatte);
video.addEventListener('playing',()=>{canvas.hidden=false;fitSprite();scheduleFrames(eggRequest);});
video.addEventListener('ended',endEgg);
video.addEventListener('error',()=>{endEgg();toast('彩蛋加载失败，请用支持本地网页的浏览器打开。');});
window.addEventListener('resize',fitSprite);if(window.visualViewport)window.visualViewport.addEventListener('resize',fitSprite);
document.addEventListener('visibilitychange',()=>{if(document.hidden)endEgg();});
function reply(text){if(/[❤🧡]/u.test(text))return '这颗心收到啦，给你也留一颗。🧡';if(/累|烦|难过|困/.test(text))return '那就先歇一下吧。不必每一刻都满格，我陪你慢慢来。';if(/你好|嗨|hello/i.test(text))return '嗨！你的消息一来，这里就热闹了。';if(/好运|开心|快乐/.test(text))return '把今天的好运分你一半，剩下的一半留给明天。';if(/谢谢/.test(text))return '不客气呀，和你聊聊天就很开心。';return ['我在听呢，继续说。','普通的一天，也值得认真收藏。','喜欢这种随便聊两句的时刻。'][replyCount++%3];}
function submitMessage(text){const clean=text.trim();if(!clean)return;appendMessage(clean,true);input.value='';$('send-button').disabled=true;if(isSecret(clean))triggerEgg();else appendMessage(reply(clean),false);}
$('chat-form').addEventListener('submit',event=>{event.preventDefault();submitMessage(input.value);});input.addEventListener('input',()=>{$('send-button').disabled=!input.value.trim();});input.addEventListener('keydown',event=>{if(event.key==='Enter'&&(event.isComposing||event.keyCode===229))event.preventDefault();});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){endEgg();$('info-panel').hidden=true;$('info-button').setAttribute('aria-expanded','false');$('emoji-tray').hidden=true;$('emoji-button').setAttribute('aria-expanded','false');}});
$('info-button').addEventListener('click',()=>{const show=$('info-panel').hidden;$('info-panel').hidden=!show;$('info-button').setAttribute('aria-expanded',String(show));});$('close-info').addEventListener('click',()=>{$('info-panel').hidden=true;$('info-button').setAttribute('aria-expanded','false');});
for(const id of ['header-heart','composer-heart'])$(id).addEventListener('click',()=>submitMessage('🧡'));
$('emoji-button').addEventListener('click',()=>{const show=$('emoji-tray').hidden;$('emoji-tray').hidden=!show;$('emoji-button').setAttribute('aria-expanded',String(show));fitSprite();});
document.querySelectorAll('[data-emoji]').forEach(button=>button.addEventListener('click',()=>{input.value+=button.dataset.emoji;$('send-button').disabled=false;input.focus();$('emoji-tray').hidden=true;$('emoji-button').setAttribute('aria-expanded','false');fitSprite();}));
const today=new Date();$('date-line').textContent='今天 '+today.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});history.forEach(renderMessage);scrollBottom();

</script></body></html>
